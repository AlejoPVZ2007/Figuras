<div class="page-wrapper">

    <!-- Panel izquierdo: Login -->
    <div class="login-panel">
        <h1>Login</h1>

        <form class="login-form" (ngSubmit)="onLogin()">

        <!-- Username -->
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Username</mat-label>
            <input matInput placeholder="Ingrese su usuario" />
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hide() ? 'password' : 'text'" placeholder="************"/>
            <button
            matIconButton
            matSuffix
            type="button"
            (click)="clickEvent($event)"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hide()"
            >
            <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
        </mat-form-field>

        <!-- Submit -->
        <button mat-raised-button color="primary" type="submit" class="full-width">
            Login
        </button>

        </form>
    </div>

    <!-- Panel derecho: Imagen -->
    <div class="image-panel">
        <img src="img/dragon.jpg" alt="Two manga-style characters in a dramatic split panel each making hand seals, one smiling with raised hand and one focused below, set against a minimal background conveying tension and determination"/>
    </div>

</div>
