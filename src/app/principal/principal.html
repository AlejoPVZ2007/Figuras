<app-navbar></app-navbar>
<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image"></div>
    <mat-card-title>Broly</mat-card-title>
    <mat-card-subtitle>Dragon Ball Z</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image src="https://ae01.alicdn.com/kf/Se7556ca3f7b6426987b922b6ac78c5b41.jpg" alt="Photo of a Shiba Inu">
  <mat-card-content>
    <p>
      The Shiba Inu is the smallest of the six original and distinct spitz breeds of dog from Japan.
      A small, agile dog that copes very well with mountainous terrain, the Shiba Inu was originally
      bred for hunting.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>
      <mat-icon>thumb_up</mat-icon>LIKE
    </button>
    <button matButton>
      <mat-icon>share</mat-icon>SHARE
    </button>
  </mat-card-actions>
</mat-card>
