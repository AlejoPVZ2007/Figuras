<mat-tab-group id="categorias">
  <mat-tab label="Figuras">
    <!--Colección de figuras-->
  </mat-tab>
  <mat-tab label="Cuadros">
    <!--Colección de cuadros-->
  </mat-tab>
  <mat-tab label="Tickets">
    <!--Colección de tickets-->
  </mat-tab>
</mat-tab-group>


<div class="cards-container" id="famosas">
  @for (figura of figuraPorId; track figura.idFigura) {
      <mat-card class="figura-card example-card" appearance="outlined">
        <mat-card-header>
      <div mat-card-avatar 
          [style.background-image]="'url(' + figura.icono + ')'"
          [style.background-size]="'cover'"
          [style.background-position]="'center'">
      </div>
      <mat-card-title>{{ figura.nombre }}</mat-card-title>
      <mat-card-subtitle>{{ figura.serie }}</mat-card-subtitle>
    </mat-card-header>
      <img mat-card-image [src]="figura.imagen" [alt]="figura.nombre">
        <mat-card-content>
            <p><strong>Tamaño:</strong> {{ figura.tamanio }}</p>
              <p><strong>Fecha:</strong> {{ figura.fecha | date:'dd/MM/yyyy' }}</p>
        </mat-card-content>
        <mat-card-actions>
          <button matButton>
            <mat-icon>thumb_up</mat-icon>LIKE
          </button>
          <button matButton>
            <mat-icon>share</mat-icon>SHARE
          </button>
        </mat-card-actions>
    </mat-card>
  }
</div>

<app-footer></app-footer>
